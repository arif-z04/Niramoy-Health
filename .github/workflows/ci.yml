name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Build & Test Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore backend/NiramoyHealth.slnx

      - name: Build Backend
        run: dotnet build backend/NiramoyHealth.slnx --configuration Release --no-restore

      - name: Run Unit & Integration Tests
        run: dotnet test backend/NiramoyHealth.slnx --configuration Release --no-build --verbosity normal

  frontend:
    name: Build Frontend (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Assets
        run: npm run build
